# netlify.toml for dockafiplatform.netlify.app
# Place this at the root of the dockafiplatform deployment folder

[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

# Daily coverage warnings and 6-month auto-cancel. UTC 13:00 is morning US Eastern.
# Scheduled functions run on published deploys. Run now works on a deploy preview.
[functions."coverage-schedule"]
  schedule = "0 13 * * *"

# Route /api/* → /.netlify/functions/*
[[redirects]]
  from = "/api/*"
  to   = "/.netlify/functions/:splat"
  status = 200
