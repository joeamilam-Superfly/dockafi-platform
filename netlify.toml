# netlify.toml for dockafiplatform.netlify.app
# Place this at the root of the dockafiplatform deployment folder

[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

# Route /api/* → /.netlify/functions/*
[[redirects]]
  from = "/api/*"
  to   = "/.netlify/functions/:splat"
  status = 200
